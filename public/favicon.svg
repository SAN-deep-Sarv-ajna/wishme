<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="wGrad" x1="8" y1="12" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="45%" stopColor="#EC4899" />
      <stop offset="85%" stopColor="#F43F5E" />
      <stop offset="100%" stopColor="#FB923C" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="16" y1="14" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F472B6" />
      <stop offset="100%" stopColor="#E11D48" />
    </linearGradient>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </radialGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="48" height="48" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Ribbon Shadow Track -->
  <path
    d="M10 15 C10 15 13.5 35 15.5 37 C17.5 39 21.5 34 24 23 C26.5 34 30.5 39 32.5 37 C34.5 35 38 15 38 15"
    stroke="#1E1B4B"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />

  <!-- Primary Ribbon 'W' Flow -->
  <path
    d="M10 15 C10 15 13.5 35 15.5 37 C17.5 39 21.5 34 24 23 C26.5 34 30.5 39 32.5 37 C34.5 35 38 15 38 15"
    stroke="url(#wGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Heart Ribbon Knot -->
  <path
    d="M19 19.5 C19 16.5 21.5 15 24 17.5 C26.5 15 29 16.5 29 19.5 C29 23 25.5 25.5 24 27.5 C22.5 25.5 19 23 19 19.5 Z"
    fill="url(#heartGrad)"
  />

  <!-- Radiant 4-Point Sparkle on Upper Wing -->
  <path
    d="M39 10 C39 12 40 13 42 13 C40 13 39 14 39 16 C39 14 38 13 36 13 C38 13 39 12 39 10 Z"
    fill="url(#starGrad)"
  />
</svg>
